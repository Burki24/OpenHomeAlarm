<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/icons.js"></script>
    <style>{{OHA_STYLE}}</style>
</head>
<body>
    <main class="oha-shell" id="ohaRoot">
        <header class="oha-topbar">
            <div class="oha-topbar-status">
                <span class="oha-live-dot" aria-hidden="true"></span>
                <span id="brandSubtitle"></span>
            </div>
            <button class="oha-icon-button" id="refreshButton" type="button" aria-label="Refresh">
                <i class="fa-light fa-arrows-rotate" aria-hidden="true"></i>
            </button>
        </header>

        <section class="oha-hero" id="statusHero" aria-live="polite">
            <div class="oha-hero-icon" id="stateIcon" aria-hidden="true">
                <i class="fa-light fa-shield"></i>
            </div>
            <div class="oha-hero-copy">
                <div class="oha-eyebrow" id="heroEyebrow"></div>
                <h1 class="oha-state" id="stateLabel">State</h1>
                <p class="oha-hero-message" id="heroMessage"></p>
            </div>
            <div class="oha-hero-meta">
                <span class="oha-mode-pill" id="modeLabel">Mode</span>
                <div class="oha-countdown" id="heroCountdown" hidden>
                    <strong id="delayRemaining">0</strong>
                    <span id="countdownUnit"></span>
                </div>
            </div>
        </section>

        <section class="oha-status-grid" id="statusGrid" aria-label="System overview">
            <article class="oha-status-card">
                <span class="oha-status-card-icon" aria-hidden="true"><i class="fa-light fa-shield-check"></i></span>
                <div><span class="oha-status-card-label" id="summaryModeLabel"></span><strong id="summaryModeValue"></strong></div>
            </article>
            <article class="oha-status-card">
                <span class="oha-status-card-icon" aria-hidden="true"><i class="fa-light fa-wave-pulse"></i></span>
                <div><span class="oha-status-card-label" id="summaryMonitoringLabel"></span><strong id="summaryMonitoringValue"></strong></div>
            </article>
            <article class="oha-status-card">
                <span class="oha-status-card-icon" aria-hidden="true"><i class="fa-light fa-triangle-exclamation"></i></span>
                <div><span class="oha-status-card-label" id="summaryFaultLabel"></span><strong id="summaryFaultValue"></strong></div>
            </article>
            <article class="oha-status-card">
                <span class="oha-status-card-icon" aria-hidden="true"><i class="fa-light fa-bell"></i></span>
                <div><span class="oha-status-card-label" id="summaryMemoryLabel"></span><strong id="summaryMemoryValue"></strong></div>
            </article>
        </section>

        <section class="oha-context-grid" id="contextGrid" aria-live="polite">
            <article class="oha-context-card oha-context-alarm" id="alarmMemoryPanel" hidden>
                <div class="oha-context-icon" aria-hidden="true">
                    <i class="fa-light fa-bell"></i>
                </div>
                <div class="oha-context-copy">
                    <strong id="alarmMemoryTitle"></strong>
                    <span id="alarmMemoryDetail"></span>
                </div>
            </article>

            <article class="oha-context-card oha-context-fault" id="faultPanel" hidden>
                <div class="oha-context-icon" aria-hidden="true">
                    <i class="fa-light fa-triangle-exclamation"></i>
                </div>
                <div class="oha-context-copy">
                    <strong id="faultTitle"></strong>
                    <span id="faultDetail"></span>
                </div>
            </article>

            <article class="oha-context-card oha-context-bypass" id="bypassPanel" hidden>
                <div class="oha-context-icon" aria-hidden="true">
                    <i class="fa-light fa-eye-slash"></i>
                </div>
                <div class="oha-context-copy">
                    <strong id="bypassTitle"></strong>
                    <span id="bypassDetail"></span>
                </div>
            </article>
        </section>

        <section class="oha-arm-section" id="armingSection">
            <div class="oha-section-heading">
                <div>
                    <div class="oha-section-kicker" id="armingKicker"></div>
                    <h2 id="armingTitle"></h2>
                </div>
                <span class="oha-section-hint" id="armingHint"></span>
            </div>

            <div class="oha-mode-grid">
                <article class="oha-mode-card" data-mode="home">
                    <div class="oha-mode-card-head">
                        <span class="oha-mode-icon" aria-hidden="true">
                            <i class="fa-light fa-house"></i>
                        </span>
                        <div class="oha-mode-card-copy">
                            <strong data-role="mode-title"></strong>
                            <span class="oha-readiness" data-role="readiness"></span>
                        </div>
                        <span class="oha-ready-dot" aria-hidden="true"></span>
                    </div>
                    <div class="oha-blockers" data-role="blockers"></div>
                    <button class="oha-arm-button" data-action="arm" data-mode="home" type="button">
                        <span data-role="button-label"></span>
                        <i class="fa-light fa-arrow-right" aria-hidden="true"></i>
                    </button>
                </article>

                <article class="oha-mode-card" data-mode="away">
                    <div class="oha-mode-card-head">
                        <span class="oha-mode-icon" aria-hidden="true">
                            <i class="fa-light fa-person-walking-arrow-right"></i>
                        </span>
                        <div class="oha-mode-card-copy">
                            <strong data-role="mode-title"></strong>
                            <span class="oha-readiness" data-role="readiness"></span>
                        </div>
                        <span class="oha-ready-dot" aria-hidden="true"></span>
                    </div>
                    <div class="oha-blockers" data-role="blockers"></div>
                    <button class="oha-arm-button" data-action="arm" data-mode="away" type="button">
                        <span data-role="button-label"></span>
                        <i class="fa-light fa-arrow-right" aria-hidden="true"></i>
                    </button>
                </article>

                <article class="oha-mode-card" data-mode="night">
                    <div class="oha-mode-card-head">
                        <span class="oha-mode-icon" aria-hidden="true">
                            <i class="fa-light fa-moon"></i>
                        </span>
                        <div class="oha-mode-card-copy">
                            <strong data-role="mode-title"></strong>
                            <span class="oha-readiness" data-role="readiness"></span>
                        </div>
                        <span class="oha-ready-dot" aria-hidden="true"></span>
                    </div>
                    <div class="oha-blockers" data-role="blockers"></div>
                    <button class="oha-arm-button" data-action="arm" data-mode="night" type="button">
                        <span data-role="button-label"></span>
                        <i class="fa-light fa-arrow-right" aria-hidden="true"></i>
                    </button>
                </article>
            </div>
        </section>

        <aside class="oha-inline-codepad" id="inlineCodepad" data-enabled="false" aria-label="Code pad">
            <header class="oha-inline-codepad-head">
                <div>
                    <div class="oha-section-kicker" id="inlineCodepadKicker"></div>
                    <h2 id="inlineCodepadTitle"></h2>
                </div>
                <span class="oha-inline-codepad-state" id="inlineCodepadState"></span>
            </header>

            <p class="oha-inline-codepad-hint" id="inlineCodepadHint"></p>

            <div class="oha-code-display oha-code-display-inline" id="inlineCodepadDisplay" data-code-display aria-live="polite">
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
            </div>

            <div class="oha-code-error" id="inlineCodepadError" data-code-error role="alert" hidden></div>

            <div class="oha-code-grid oha-code-grid-inline" id="inlineCodepadGrid" data-code-grid>
                <button class="oha-code-key" data-code-digit="1" data-code-surface="inline" type="button">1</button>
                <button class="oha-code-key" data-code-digit="2" data-code-surface="inline" type="button">2</button>
                <button class="oha-code-key" data-code-digit="3" data-code-surface="inline" type="button">3</button>
                <button class="oha-code-key" data-code-digit="4" data-code-surface="inline" type="button">4</button>
                <button class="oha-code-key" data-code-digit="5" data-code-surface="inline" type="button">5</button>
                <button class="oha-code-key" data-code-digit="6" data-code-surface="inline" type="button">6</button>
                <button class="oha-code-key" data-code-digit="7" data-code-surface="inline" type="button">7</button>
                <button class="oha-code-key" data-code-digit="8" data-code-surface="inline" type="button">8</button>
                <button class="oha-code-key" data-code-digit="9" data-code-surface="inline" type="button">9</button>
                <button class="oha-code-key oha-code-key-secondary" id="inlineCodepadDelete" data-code-delete data-code-surface="inline" type="button">
                    <i class="fa-light fa-delete-left" aria-hidden="true"></i>
                </button>
                <button class="oha-code-key" data-code-digit="0" data-code-surface="inline" type="button">0</button>
                <button class="oha-code-key oha-code-key-secondary" id="inlineCodepadClear" data-code-clear data-code-surface="inline" type="button">
                    <i class="fa-light fa-eraser" aria-hidden="true"></i>
                </button>
            </div>

            <button class="oha-inline-disarm-button" id="inlineCodepadConfirm" data-code-confirm data-code-surface="inline" type="button">
                <i class="fa-light fa-lock-open" aria-hidden="true"></i>
                <span id="inlineDisarmLabel"></span>
            </button>
        </aside>

        <section class="oha-control-bar" id="controlBar" hidden>
            <div class="oha-control-copy">
                <strong id="controlTitle"></strong>
                <span id="codeHint" hidden></span>
            </div>
            <button class="oha-disarm-button" id="disarmButton" type="button">
                <i class="fa-light fa-lock-open" aria-hidden="true"></i>
                <span id="disarmButtonLabel"></span>
            </button>
        </section>
    </main>

    <div class="oha-codepad-overlay" id="codepadOverlay" hidden>
        <section class="oha-codepad" role="dialog" aria-modal="true" aria-labelledby="codepadTitle" aria-describedby="codepadHint">
            <header class="oha-codepad-head">
                <div class="oha-codepad-title-wrap">
                    <span class="oha-codepad-icon" aria-hidden="true">
                        <i class="fa-light fa-key"></i>
                    </span>
                    <div>
                        <h2 id="codepadTitle"></h2>
                        <p id="codepadHint"></p>
                    </div>
                </div>
                <button class="oha-codepad-close" id="codepadClose" type="button">
                    <i class="fa-light fa-xmark" aria-hidden="true"></i>
                </button>
            </header>

            <div class="oha-code-display" id="codepadDisplay" data-code-display aria-live="polite">
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
                <span class="oha-code-dot" aria-hidden="true"></span>
            </div>

            <div class="oha-code-error" id="codepadError" data-code-error role="alert" hidden></div>

            <div class="oha-code-grid" id="codepadGrid" data-code-grid>
                <button class="oha-code-key" data-code-digit="1" data-code-surface="modal" type="button">1</button>
                <button class="oha-code-key" data-code-digit="2" data-code-surface="modal" type="button">2</button>
                <button class="oha-code-key" data-code-digit="3" data-code-surface="modal" type="button">3</button>
                <button class="oha-code-key" data-code-digit="4" data-code-surface="modal" type="button">4</button>
                <button class="oha-code-key" data-code-digit="5" data-code-surface="modal" type="button">5</button>
                <button class="oha-code-key" data-code-digit="6" data-code-surface="modal" type="button">6</button>
                <button class="oha-code-key" data-code-digit="7" data-code-surface="modal" type="button">7</button>
                <button class="oha-code-key" data-code-digit="8" data-code-surface="modal" type="button">8</button>
                <button class="oha-code-key" data-code-digit="9" data-code-surface="modal" type="button">9</button>
                <button class="oha-code-key oha-code-key-secondary" id="codepadDelete" data-code-delete data-code-surface="modal" type="button">
                    <i class="fa-light fa-delete-left" aria-hidden="true"></i>
                </button>
                <button class="oha-code-key" data-code-digit="0" data-code-surface="modal" type="button">0</button>
                <button class="oha-code-key oha-code-key-secondary" id="codepadClear" data-code-clear data-code-surface="modal" type="button">
                    <i class="fa-light fa-eraser" aria-hidden="true"></i>
                </button>
            </div>

            <button class="oha-modal-disarm-button" id="codepadConfirm" data-code-confirm data-code-surface="modal" type="button">
                <i class="fa-light fa-lock-open" aria-hidden="true"></i>
                <span id="modalDisarmLabel"></span>
            </button>
        </section>
    </div>

    <script>
        window.OHA_INITIAL_STATE = {{OHA_INITIAL_STATE}};
    </script>
    <script>{{OHA_SCRIPT}}</script>
</body>
</html>
