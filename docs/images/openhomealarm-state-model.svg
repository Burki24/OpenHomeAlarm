<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
  <title id="title">Zustandsmodell eines OpenHomeAlarm-Alarmbereichs</title>
  <desc id="description">Das Diagramm zeigt die Zustände Unscharf, Ausgangsverzögerung, Scharf, Eingangsverzögerung und Alarm sowie Scharfschaltung, Unscharfschaltung, direkte Alarme, automatische Wiederbewaffnung, Überbrückungen und Durchgangsfreigaben.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-critical" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 30px "Segoe UI", Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 17px "Segoe UI", Arial, sans-serif; }
      .node-title { fill: #0f172a; font: 700 21px "Segoe UI", Arial, sans-serif; }
      .node-copy { fill: #334155; font: 400 15px "Segoe UI", Arial, sans-serif; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-join { fill: none; stroke: #64748b; stroke-width: 2; }
      .edge-critical { fill: none; stroke: #b42318; stroke-width: 2.5; marker-end: url(#arrow-critical); }
      .edge-note { fill: #334155; font: 600 14px "Segoe UI", Arial, sans-serif; }
      .edge-note-critical { fill: #8f1d14; font: 600 14px "Segoe UI", Arial, sans-serif; }
      .card-title { fill: #0f172a; font: 700 18px "Segoe UI", Arial, sans-serif; }
      .card-copy { fill: #334155; font: 400 14px "Segoe UI", Arial, sans-serif; }
      .connector { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }
      .legend { fill: #475569; font: 400 14px "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect class="canvas" width="1440" height="1080" rx="22"/>

  <text class="title" x="112" y="54">Zustandsmodell eines Alarmbereichs</text>
  <text class="subtitle" x="112" y="84">Jeder aktive Bereich führt Modus, Zustand, Verzögerungen und Alarm unabhängig; main fasst alle aktiven Bereiche zusammen.</text>

  <!-- 24/7 bypasses the normal arming flow. -->
  <rect x="1010" y="105" width="380" height="74" rx="16" fill="#fff1f0" stroke="#f3b7b2" stroke-width="2"/>
  <text class="edge-note-critical" x="1032" y="134">24/7-Sensor oder alarmierender Störungseingang</text>
  <text class="node-copy" x="1032" y="159">löst aus jedem Zustand unmittelbar Alarm aus.</text>
  <path class="edge-critical" d="M 1200 179 V 220"/>

  <!-- Main states. -->
  <g>
    <rect x="45" y="220" width="220" height="112" rx="18" fill="#eef2f6" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="76" cy="251" r="11" fill="#64748b"/>
    <text class="node-title" x="98" y="258">Unscharf</text>
    <text class="node-copy" x="66" y="292">Kein Scharfmodus</text>
    <text class="node-copy" x="66" y="315">24/7-Überwachung bleibt aktiv</text>
  </g>

  <g>
    <rect x="325" y="220" width="230" height="112" rx="18" fill="#fff7e6" stroke="#e5a11a" stroke-width="2.5"/>
    <circle cx="356" cy="251" r="11" fill="#d89213"/>
    <text class="node-title" x="378" y="258">Ausgangsverzögerung</text>
    <text class="node-copy" x="346" y="292">Countdown läuft</text>
    <text class="node-copy" x="346" y="315">Abschlussprüfung folgt</text>
  </g>

  <g>
    <rect x="615" y="220" width="220" height="112" rx="18" fill="#ecfdf3" stroke="#26a269" stroke-width="2.5"/>
    <circle cx="646" cy="251" r="11" fill="#218c5b"/>
    <text class="node-title" x="668" y="258">Scharf</text>
    <text class="node-copy" x="636" y="292">Sensoren des Scharfmodus</text>
    <text class="node-copy" x="636" y="315">werden überwacht</text>
  </g>

  <g>
    <rect x="895" y="220" width="230" height="112" rx="18" fill="#fff7e6" stroke="#e5a11a" stroke-width="2.5"/>
    <circle cx="926" cy="251" r="11" fill="#d89213"/>
    <text class="node-title" x="948" y="258">Eingangsverzögerung</text>
    <text class="node-copy" x="916" y="292">Countdown zum Alarm</text>
    <text class="node-copy" x="916" y="315">Unscharfschalten bleibt möglich</text>
  </g>

  <g>
    <rect x="1175" y="220" width="220" height="112" rx="18" fill="#fff1f0" stroke="#d92d20" stroke-width="2.5"/>
    <circle cx="1206" cy="251" r="11" fill="#c6281c"/>
    <text class="node-title" x="1228" y="258">Alarm</text>
    <text class="node-copy" x="1196" y="292">Alarmaktionen laufen</text>
    <text class="node-copy" x="1196" y="315">Alarmgedächtnis gesetzt</text>
  </g>

  <!-- Primary flow. -->
  <path class="edge" d="M 265 276 H 325"/>
  <text class="edge-note" x="295" y="194" text-anchor="middle">Scharfschalten</text>
  <text class="legend" x="295" y="212" text-anchor="middle">Verzögerung &gt; 0</text>

  <path class="edge" d="M 555 276 H 615"/>
  <text class="edge-note" x="585" y="194" text-anchor="middle">Countdown beendet</text>
  <text class="legend" x="585" y="212" text-anchor="middle">Abschlussprüfung bereit</text>

  <path class="edge" d="M 835 276 H 895"/>
  <text class="edge-note" x="865" y="194" text-anchor="middle">Verzögerter</text>
  <text class="legend" x="865" y="212" text-anchor="middle">Sensor löst aus</text>

  <path class="edge-critical" d="M 1125 276 H 1175"/>
  <text class="edge-note-critical" x="1150" y="194" text-anchor="middle">Countdown abgelaufen</text>
  <text class="legend" x="1150" y="212" text-anchor="middle">oder Sofort-Sensor</text>

  <!-- Arming without a delay. -->
  <path class="edge" d="M 155 220 C 155 112, 725 112, 725 220"/>
  <text class="edge-note" x="440" y="116" text-anchor="middle">Scharfschalten mit 0 Sekunden</text>

  <!-- Immediate alarm and automatic rearming. -->
  <path class="edge-critical" d="M 725 332 C 725 394, 1285 394, 1285 332"/>
  <text class="edge-note-critical" x="1005" y="378" text-anchor="middle" style="paint-order: stroke; stroke: #f8fafc; stroke-width: 6px; stroke-linejoin: round">Sofort auslösender Sensor</text>

  <path class="edge" d="M 1285 332 C 1285 468, 725 468, 725 332"/>
  <text class="edge-note" x="1005" y="446" text-anchor="middle" style="paint-order: stroke; stroke: #f8fafc; stroke-width: 6px; stroke-linejoin: round">Alarmdauer beendet · bereit · automatische Wiederbewaffnung</text>

  <!-- All active states can be disarmed; a failed final exit check also returns to disarmed. -->
  <path class="edge-join" d="M 440 332 V 548"/>
  <path class="edge-join" d="M 725 332 V 548"/>
  <path class="edge-join" d="M 1010 332 V 548"/>
  <path class="edge-join" d="M 1285 332 V 548"/>
  <path class="edge" d="M 1285 548 H 155 V 332"/>
  <text class="edge-note" x="720" y="526" text-anchor="middle">Unscharfschalten aus jedem aktiven Zustand</text>
  <text class="legend" x="720" y="546" text-anchor="middle">Ausgangsverzögerung kehrt auch bei fehlgeschlagener Abschlussprüfung sicher zu Unscharf zurück.</text>

  <!-- Supporting behavior that does not introduce additional system states. -->
  <path class="connector" d="M 155 548 V 680"/>
  <path class="connector" d="M 725 548 V 650 H 720 V 680"/>
  <path class="connector" d="M 1010 548 V 650 H 720"/>
  <path class="connector" d="M 1285 548 V 680"/>
  <rect x="44" y="594" width="520" height="54" rx="10" fill="#f8fafc"/>
  <text class="title" x="56" y="628" style="font-size: 23px">Sonderregeln ohne eigenen Systemzustand</text>

  <rect x="45" y="680" width="410" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="card-title" x="70" y="718">Einmalige Sensorüberbrückung</text>
  <text class="card-copy" x="70" y="756">• Manuell nur im Zustand Unscharf vorbereitbar.</text>
  <text class="card-copy" x="70" y="792">• Gilt bereichsbezogen für den nächsten</text>
  <text class="card-copy" x="88" y="815">Scharfschaltzyklus.</text>
  <text class="card-copy" x="70" y="851">• Automatisch nur für ausdrücklich freigegebene Sensoren.</text>
  <text class="card-copy" x="70" y="887">• Fehlende Sensoren, Störungen und 24/7-Sensoren</text>
  <text class="card-copy" x="88" y="910">bleiben blockierend.</text>
  <text class="card-copy" x="70" y="946">• Endet spätestens beim Unscharfschalten.</text>

  <rect x="515" y="680" width="410" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="card-title" x="540" y="718">Temporäre Durchgangsfreigabe</text>
  <text class="card-copy" x="540" y="756">• Wird im Zustand Scharf oder während der passenden</text>
  <text class="card-copy" x="558" y="779">Eingangsverzögerung erteilt.</text>
  <text class="card-copy" x="540" y="815">• Der Bereich bleibt während eines Öffnen-/Schließen-</text>
  <text class="card-copy" x="558" y="838">Zyklus scharf.</text>
  <text class="card-copy" x="540" y="874">• Alle anderen Sensoren bleiben überwacht.</text>
  <text class="card-copy" x="540" y="910">• Schließen beendet die Freigabe.</text>
  <text class="card-copy" x="540" y="946">• Fristablauf bei ausgelöstem Sensor führt zu Alarm.</text>

  <rect x="985" y="680" width="410" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="card-title" x="1010" y="718">Alarmausgang und Alarmgedächtnis</text>
  <text class="card-copy" x="1010" y="756">• Der Alarmausgang kann enden oder zurückgesetzt</text>
  <text class="card-copy" x="1028" y="779">werden. Der Bereich bleibt im Zustand Alarm.</text>
  <text class="card-copy" x="1010" y="815">• Unscharfschalten beendet den aktiven Bereich.</text>
  <text class="card-copy" x="1010" y="851">• Das Alarmgedächtnis bleibt nach dem Unscharfschalten</text>
  <text class="card-copy" x="1028" y="874">erhalten, bis es bewusst quittiert wird.</text>
  <text class="card-copy" x="1010" y="910">• Automatische Wiederbewaffnung erfolgt nur bei</text>
  <text class="card-copy" x="1028" y="933">Bereitschaft.</text>

  <line x1="56" y1="1020" x2="1384" y2="1020" stroke="#d7dee8" stroke-width="1.5"/>
  <text class="legend" x="56" y="1050">Farben unterstützen die Orientierung; maßgeblich bleiben die ausgeschriebenen Zustände und Übergangsbedingungen.</text>
</svg>
