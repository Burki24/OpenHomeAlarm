name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Verify vendored helper integrity
        run: python3 tests/helper_integrity.py

      - name: Validate Symcon module structure
        run: python3 tests/validate_structure.py

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

      - name: Check Symcon Strict foundation
        run: php tests/symcon-strict.php

      - name: Check extracted alarm domain model
        run: php tests/domain-model.php

      - name: Check alarm state model
        run: php tests/state-model.php

      - name: Check sensor and trigger model
        run: php tests/sensor-model.php

      - name: Check active sensor monitoring
        run: php tests/sensor-monitoring.php

      - name: Check mode-specific arming readiness and blockers
        run: php tests/readiness.php

      - name: Check arming and disarming logic
        run: php tests/arming.php

      - name: Check entry and exit delays with countdown status
        run: php tests/delays.php

      - name: Check exit-route arming behavior
        run: php tests/exit-route.php

      - name: Check alarm actions
        run: php tests/alarm-actions.php

      - name: Check alarm duration and reset handling
        run: php tests/alarm-duration.php

      - name: Check disarm code protection
        run: php tests/disarm-code.php

      - name: Check alarm memory
        run: php tests/alarm-memory.php

      - name: Check 24/7 sensors
        run: php tests/always-active.php

      - name: Check temporary sensor bypasses
        run: php tests/bypass.php

      - name: Check restart-safe armed sensor recovery
        run: php tests/restart-recovery.php

      - name: Check persistent security event history
        run: php tests/event-history.php

      - name: Check tamper and fault monitoring
        run: php tests/fault-monitoring.php

      - name: Check stable public control API
        run: php tests/control-api.php

      - name: Check HTML-SDK visualization foundation
        run: php tests/visualization.php

      - name: Check visualization disarm codepad
        run: php tests/codepad.php

      - name: Check visualization JavaScript syntax
        run: node --check OpenHomeAlarm/visualization/app.js
